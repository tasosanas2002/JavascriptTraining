<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ex1 GET</title>
  <style>
    body { font-family: Arial, sans-serif; padding:16px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .box { border:1px solid #ccc; padding:12px; margin:12px 0; }
    input, textarea, button { padding:8px; }
    ul { padding-left:18px; }
    .muted { color:#666; }
    .error { color:#b00020; }
  </style>
</head>
<body>
  <h2>Exercise 1: GET /posts</h2>

  <div class="row">
    <button id="loadBtn">Load posts</button>
    <span id="status" class="muted"></span>
  </div>

  <div class="box">
    <ul id="list"></ul>
  </div>

  <script>
    var API = "https://jsonplaceholder.typicode.com";
    var loadBtn = document.getElementById("loadBtn");
    var statusEl = document.getElementById("status");
    var list = document.getElementById("list");

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? "error" : "muted";
    }

    loadBtn.addEventListener("click", function () {
      list.innerHTML = "";

      fetch(API + "/posts?_limit=8")
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (posts) {
          list.innerHTML = posts.map(function (p) {
            return "<li><b>" + p.title + "</b></li>";
          }).join("");
        })
        .catch(function (e) {
          setStatus("Failed to load posts: " + e.message, true);
        });
    });
  </script>
</body>
</html>
